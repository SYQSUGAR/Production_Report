name: production-report-dev

services:
  mysql:
    image: mysql:8.4
    container_name: production-report-mysql
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_USER: report_user
      MYSQL_PASSWORD: report123
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - production_report_mysql_data:/var/lib/mysql
      - ./reference_database/01_basic_data.sql:/docker-entrypoint-initdb.d/01_basic_data.sql:ro
      - ./reference_database/02_energy_data.sql:/docker-entrypoint-initdb.d/02_energy_data.sql:ro
      - ./reference_database/03_operation_data.sql:/docker-entrypoint-initdb.d/03_operation_data.sql:ro
      - ./reference_database/04_maintenance_data.sql:/docker-entrypoint-initdb.d/04_maintenance_data.sql:ro
      - ./reference_database/06_grant_reference_user.sql:/docker-entrypoint-initdb.d/06_grant_reference_user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s

volumes:
  production_report_mysql_data:
    name: production-report-mysql-data
